<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Login - Futuristic Stock</title>
    <style>
        :root {
            --primary: #4977DF; 
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        /* TEMA CLARO */
        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-card {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            position: relative;
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* Botão do Tema no topo direito do cartão */
        .btn-theme {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-theme:hover { background: var(--border); }

        h1 { color: var(--text-main); margin-top: 0; text-align: center; font-size: 24px; font-weight: 600; }
        
        label { display: block; margin-top: 15px; font-weight: 500; font-size: 14px; color: var(--text-muted); }
        
        input { 
            width: 100%; padding: 12px; margin-top: 8px; 
            background-color: var(--bg-dark); border: 1px solid var(--border); 
            border-radius: 8px; color: var(--text-main); box-sizing: border-box; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); }
        
        button[type="submit"] { 
            margin-top: 25px; background: var(--primary); color: white; border: none; 
            padding: 12px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s;
        }
        button[type="submit"]:hover { background: #3b66c4; }

        .msg { padding: 12px; margin-bottom: 20px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: 500; }
        .msg-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; }
        .msg-success { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); color: #4ade80; }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Botão Sol/Lua -->
        <button id="btn-themeToggle" class="btn-theme">
            <span id="theme-icon">☀️</span>
        </button>

        <h1>Entrar no Sistema</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="msg {% if message.tags == 'success' %}msg-success{% else %}msg-error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Acessar Painel</button>
        </form>
        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Ainda não tem uma conta? <a href="{% url 'auto_registro' %}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Registe-se aqui</a>
        </div>
    </div>

    <!-- SCRIPT DE TEMA CLARO/ESCURO -->
    <script>
        const btnTheme = document.getElementById('btn-themeToggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-theme', savedTheme);
        if(btnTheme) updateButtonUI(savedTheme);

        if(btnTheme) {
            btnTheme.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                htmlElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateButtonUI(newTheme);
            });
        }

        function updateButtonUI(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
        }
    </script>
</body>
</html>
