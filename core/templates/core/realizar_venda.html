<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Vender {{ produto.name }}</title>
    <style>
        :root {
            --c2: #492D73;
            --c3: #271DC7;
            --c4: #81D462;
            --c5: #4977DF;
            --bg-body: linear-gradient(135deg, #0b0f29, #1a103c, #0a1128);
            --bg-card: rgba(0, 0, 0, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-card: rgba(73, 119, 223, 0.3);
            --input-bg: rgba(255, 255, 255, 0.1);
        }

        /* TEMA CLARO */
        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-card: #cbd5e1;
            --input-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--bg-body);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .card-venda {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* Botão do Tema */
        .btn-theme {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--border-card);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-theme:hover { background: rgba(100, 100, 100, 0.1); }

        .card-venda h2 {
            margin-top: 0;
            color: var(--c4);
        }

        .info-estoque {
            background: var(--input-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: var(--text-muted);
            border: 1px solid var(--border-card);
        }

        .info-estoque strong {
            color: var(--text-main);
            font-size: 16px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-main);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: var(--input-bg);
            border: 1px solid var(--c5);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--c4);
            box-shadow: 0 0 10px rgba(129, 212, 98, 0.3);
        }

        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn-confirm {
            background: #1b5e20;
            color: white;
            border: 1px solid var(--c4);
        }

        .btn-confirm:hover {
            background: var(--c4);
            color: #0b0f29;
            box-shadow: 0 0 15px var(--c4);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-card);
        }

        .btn-cancel:hover {
            background: rgba(100, 100, 100, 0.15);
            color: var(--text-main);
        }

        .msg-error {
            background: rgba(127, 29, 29, 0.4);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card-venda">
        <!-- Botão Sol/Lua -->
        <button id="btn-themeToggle" class="btn-theme">
            <span id="theme-icon">☀️</span>
        </button>

        <h2>🛒 Registrar Venda</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="msg-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <div class="info-estoque">
            Produto: <strong>{{ produto.name }}</strong><br><br>
            Estoque atual: <strong>{{ produto.quantidade_estoque }} un.</strong><br>
            Preço unitário: R$ {{ produto.preco }}
        </div>

        <form method="POST">
            {% csrf_token %}
            <label for="quantidade">Quantidade a vender:</label>
            <input type="number" id="quantidade" name="quantidade" min="1" max="{{ produto.quantidade_estoque }}" value="1" required autofocus>
            
            <div class="btn-container">
                <a href="{% url 'minha_home' %}" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-confirm">Confirmar Venda</button>
            </div>
        </form>
    </div>

    <!-- SCRIPT DE TEMA CLARO/ESCURO -->
    <script>
        const btnTheme = document.getElementById('btn-themeToggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-theme', savedTheme);
        if(btnTheme) updateButtonUI(savedTheme);

        if(btnTheme) {
            btnTheme.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                htmlElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateButtonUI(newTheme);
            });
        }

        function updateButtonUI(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
        }
    </script>
</body>
</html>
