<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Produto - Futuristic Stock</title>
    <style>
        :root {
            --primary: #4977DF; 
            --success: #22c55e;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            transition: background-color 0.3s, color 0.3s;
        }
        
        .form-container { 
            background: var(--bg-card); 
            padding: 35px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 500px; 
            transition: background-color 0.3s, border-color 0.3s;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h2 { 
            margin: 0; 
            color: var(--text-main); 
            font-weight: 600; 
            font-size: 22px; 
        }

        /* Estilo do botão de tema */
        .btn-theme { 
            background: transparent; 
            border: 1px solid var(--border); 
            color: var(--text-main); 
            padding: 8px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            transition: 0.2s; 
        }
        .btn-theme:hover { background: var(--border); }
        
        /* Estilização nativa dos campos gerados pelo Django (form.as_p) */
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 500; 
            font-size: 14px; 
            color: var(--text-muted); 
        }
        
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            background-color: var(--bg-dark); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            color: var(--text-main); 
            font-size: 14px; 
            box-sizing: border-box; 
            outline: none; 
            transition: 0.2s; 
        }
        
        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(73, 119, 223, 0.2);
        }
        
        .btn-container { 
            display: flex; 
            gap: 15px; 
            margin-top: 30px; 
        }
        
        .btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            text-decoration: none; 
            text-align: center; 
            transition: 0.2s; 
        }
        
        .btn-confirm { 
            background: var(--success); 
            color: #0f172a; 
        }
        
        .btn-confirm:hover { 
            background: #16a34a; 
            color: white;
        }
        
        .btn-cancel { 
            background: transparent; 
            color: var(--text-muted); 
            border: 1px solid var(--border); 
        }
        
        .btn-cancel:hover { 
            background: var(--bg-dark); 
            color: var(--text-main); 
        }
    </style>
</head>
<body>
    <div class="form-container">
        
        <div class="header-top">
            <h2>📦 Gestão de Produto</h2>
            <button id="btn-themeToggle" class="btn-theme">
                <span id="theme-icon">☀️</span> <span id="theme-text">Modo Claro</span>
            </button>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <!-- Renderiza os campos do formulário do Django -->
            {{ form.as_p }}
            
            <div class="btn-container">
                <a href="{% url 'minha_home' %}" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-confirm">Salvar Produto</button>
            </div>
        </form>
    </div>

    <!-- SCRIPT DE TEMA CLARO/ESCURO -->
    <script>
        const btnTheme = document.getElementById('btn-themeToggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-theme', savedTheme);
        if(btnTheme) updateButtonUI(savedTheme);

        if(btnTheme) {
            btnTheme.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                htmlElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateButtonUI(newTheme);
            });
        }

        function updateButtonUI(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Modo Claro';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Modo Escuro';
            }
        }
    </script>
</body>
</html>
