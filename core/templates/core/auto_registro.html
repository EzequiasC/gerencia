<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - Futuristic Stock</title>
    <style>
        :root {
            --primary: #4977DF; --success: #22c55e; --bg-dark: #0f172a; --bg-card: #1e293b;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
        }

        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            transition: background-color 0.3s, color 0.3s;
        }
        
        .form-container { 
            background: var(--bg-card); 
            padding: 35px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 420px; 
            position: relative; 
            transition: background-color 0.3s, border-color 0.3s;
        }
        
        h2 { margin-top: 0; color: var(--text-main); font-weight: 600; font-size: 22px; margin-bottom: 10px; text-align: center; }
        p.subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 25px; }
        
        .btn-theme {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-theme:hover { background: var(--border); }

        label { display: block; margin-top: 15px; font-weight: 500; font-size: 14px; color: var(--text-muted); }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 12px; margin-top: 8px; background-color: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; box-sizing: border-box; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); }
        .helptext { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: block; }
        ul.errorlist { color: #f87171; font-size: 13px; padding-left: 15px; margin: 5px 0; }
        
        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; transition: 0.2s; display: block; }
        .btn-confirm { background: var(--primary); color: white; }
        .btn-confirm:hover { background: #3b66c4; }
        .btn-back { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-back:hover { background: var(--bg-dark); color: var(--text-main); }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Botão Sol/Lua -->
        <button id="btn-themeToggle" class="btn-theme">
            <span id="theme-icon">☀️</span>
        </button>

        <h2>🚀 Criar Conta</h2>
        <p class="subtitle">Registe-se para aceder ao sistema</p>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="btn-container">
                <button type="submit" class="btn btn-confirm">Registar Conta</button>
                <a href="{% url 'login' %}" class="btn btn-back">Voltar ao Login</a>
            </div>
        </form>
    </div>

    <script>
        const btnTheme = document.getElementById('btn-themeToggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-theme', savedTheme);
        if(btnTheme) updateButtonUI(savedTheme);

        if(btnTheme) {
            btnTheme.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                htmlElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateButtonUI(newTheme);
            });
        }

        function updateButtonUI(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
        }
    </script>
</body>
</html>
